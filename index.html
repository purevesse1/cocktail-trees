<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cocktail Trees</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* layout: a thin top bar, then either a reading-width home page whose hero is one drink chain set like a diff,
   or a full-height tree view (header, fold-away bar checklist, pannable zoomable graph) */
:root{--bg:#ffffff;--ink:#000000;--soft:#5a5a5a;--hair:#d9d9d9;--display:"Archivo",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000000;--ink:#ffffff;--soft:#a8a8a8;--hair:#3a3a3a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000000;--ink:#ffffff;--soft:#a8a8a8;--hair:#3a3a3a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--display);display:flex;flex-direction:column}
a{color:inherit}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1.5px solid var(--ink);font-size:14px}
.brand{font-weight:800;font-stretch:80%;font-size:16px;letter-spacing:0.02em;text-transform:uppercase;text-decoration:none}
.at-home .brand{visibility:hidden}
#crumb{font:500 13px var(--mono)}
#crumb:not(:empty)::before{content:"/ ";color:var(--soft)}
#view{flex:1;min-height:0;display:flex;flex-direction:column}
:focus-visible{outline:3px solid var(--soft);outline-offset:2px}

/* home */
.home{flex:1;min-height:0;overflow-y:auto;padding:0 16px 64px}
article{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:44px}
.hero{display:flex;flex-direction:column;gap:18px;padding-top:28px}
.kicker{margin:0;font-weight:800;font-stretch:80%;font-size:16px;letter-spacing:0.02em;text-transform:uppercase;color:var(--ink)}
.chain{margin:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px;font-size:clamp(34px,11vw,64px);line-height:1}
.chain .solid{font-weight:800;font-stretch:78%;letter-spacing:-0.02em;background:var(--ink);color:var(--bg);padding:0.08em 0.22em 0.1em;border-radius:6px}
.chain .plus{font:500 0.36em/1.2 var(--mono);padding:0.25em 0 0.25em 0.9em;border-left:2px solid var(--ink);margin-left:0.75em}
.lede{margin:0;font-size:18px;line-height:1.5;max-width:34em;color:var(--ink)}
section{display:flex;flex-direction:column;gap:14px}
h2{margin:0;font:600 13px var(--mono);padding-bottom:8px;border-bottom:1.5px solid var(--ink)}
.bases{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.base{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:16px;border:1.5px solid var(--ink);border-radius:6px;text-decoration:none}
.bname{font-weight:800;font-stretch:78%;font-size:34px;line-height:1;letter-spacing:-0.01em}
.go{grid-row:1 / span 3;grid-column:2;font-size:28px}
.bmeta{font:500 13px var(--mono);font-variant-numeric:tabular-nums;margin-top:6px}
.bblurb{font-size:14px;line-height:1.45;color:var(--soft)}
.base:hover,.base:active{background:var(--ink);color:var(--bg)}
.base:hover .bblurb,.base:active .bblurb{color:var(--bg)}
.planned{margin:0;font-size:14px;line-height:1.45;color:var(--soft)}
.reading{margin:0;display:grid;grid-template-columns:minmax(96px,auto) 1fr;gap:12px 16px;font-size:15px;line-height:1.5}
.reading dt{font-weight:700}
.reading dd{margin:0;color:var(--ink)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.5}
.log li{display:grid;grid-template-columns:minmax(96px,auto) 1fr;gap:16px}
.log time{font:500 13px/1.75 var(--mono);font-variant-numeric:tabular-nums}
@media (max-width:420px){.reading,.log li{grid-template-columns:1fr;gap:2px}.reading dd{margin-bottom:10px}}

/* tree view */
.treeview{flex:1;min-height:0;display:flex;flex-direction:column}
.thead{padding:12px 16px 10px;border-bottom:1px solid var(--ink);display:flex;flex-direction:column;gap:8px;max-height:70%;overflow-y:auto}
.thead h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-0.01em;text-wrap:balance}
.thead p{margin:0;font-size:14px;line-height:1.45;color:var(--soft);max-width:65ch}
.row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;list-style:none;margin:0;padding:0}
.key li{display:flex;align-items:center;gap:6px}
.sw{width:22px;height:14px;border-radius:3px;border:1.5px solid var(--ink);display:inline-block}
.sw.have{background:var(--ink)}
.zoom{display:flex;gap:6px}
button{font:600 15px var(--display);color:var(--ink);background:var(--bg);border:1.5px solid var(--ink);border-radius:4px;min-width:44px;height:40px;padding:0 12px;cursor:pointer}
button:active{background:var(--ink);color:var(--bg)}
details{border:1.5px solid var(--ink);border-radius:4px}
summary{font-weight:600;font-size:14px;padding:9px 12px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 12px 12px}
.chip{position:relative;display:inline-flex}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{font:500 13px var(--mono);padding:6px 10px;border:1.5px solid var(--ink);border-radius:999px}
.chip input:checked+span{background:var(--ink);color:var(--bg)}
.chip input:focus-visible+span{outline:3px solid var(--soft);outline-offset:2px}
.stage{flex:1;min-height:0;overflow:hidden;position:relative;touch-action:none;overscroll-behavior:contain;user-select:none;-webkit-user-select:none}
figure{margin:0;position:absolute;inset:0}
#tree{display:block;position:absolute;left:0;top:0;transform-origin:0 0;color:var(--ink);overflow:visible}
.edge{stroke:currentColor;stroke-width:1.5}
.edge.hot{stroke-width:3.5;marker-end:url(#arrowHot)}
.lab rect{fill:var(--bg)}
.lab text{font:500 13px var(--mono);fill:currentColor;text-anchor:middle;dominant-baseline:central;white-space:pre}
.lab.hot text{font-weight:600}
.n{cursor:pointer}
.n:focus{outline:none}
.n:focus-visible .box{stroke-width:4}
.n .box{stroke:currentColor;stroke-width:1.6;fill:var(--bg)}
.n text{fill:currentColor;dominant-baseline:central}
.n .title{font:600 15px var(--display)}
.n .amt,.n .ing{font:500 13px var(--mono);white-space:pre}
.n .how{font:400 13px var(--display)}
.n .x{font:400 20px var(--display);text-anchor:middle}
.n .rule{stroke:currentColor;stroke-width:1}
.n .dot{fill:none;stroke:currentColor;stroke-width:1.5}
.n .dot.on{fill:currentColor}
.n.have .box{fill:currentColor}
.n.have text{fill:var(--bg)}
.n.have .rule{stroke:var(--bg)}
.n.have .dot{fill:var(--bg);stroke:var(--bg)}
.hub{fill:currentColor}
.hubtxt{font:700 26px var(--display);fill:var(--bg);text-anchor:middle;dominant-baseline:central}
figcaption{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
</style>
</head>
<body class="at-home">
<nav class="top" aria-label="Site"><a class="brand" href="#home">Cocktail Trees</a><span id="crumb"></span></nav>
<main id="view"></main>
<script src="data/gin.js"></script>
<script src="js/tree.js"></script>
<script src="js/site.js"></script>
</body>
</html>
